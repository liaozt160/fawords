name: 🤖 OpenHands Bridge Trigger

on:
  issues:
    types: [opened]

jobs:
  dispatch-task:
    runs-on: [self-hosted, st]
    steps:
      - name: 🚀 Dispatch Async Goal to OpenHands
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🚀 Dispatching Issue #$ISSUE_NUM to OpenHands..."

          # Fetch API Key from server side persistent file
          API_KEY=$(cat /home/openhands/.openhands/agent-canvas/api-key.txt)

          # Construct correct JSON payload for OpenHands Native API
          PROMPT="你是一个全栈 AI 工程师。请处理 Fawords 项目的 Issue #${ISSUE_NUM}: ${ISSUE_TITLE}。
          需求：${ISSUE_BODY}
          执行规范：
          1. 切换到工作目录 /projects/fawords。
          2. 在 Issue #${ISSUE_NUM} 下回复任务领取状态。
          3. 编写代码并运行 './mvnw test' 验证。
          4. 创建分支 feat/issue-${ISSUE_NUM}，推送并创建 PR。
          5. 任务完成后，调用 DELETE /api/conversations/$CONV_ID 销毁会话。"

          PAYLOAD=$(jq -n \
            --arg title "Issue #$ISSUE_NUM: $ISSUE_TITLE" \
            --arg dir "/projects/fawords" \
            --arg goal "$PROMPT" \
            '{title: $title, workspace: {working_dir: $dir}, initial_message: {role: "user", content: [{type: "text", text: $goal}]}}')

          # 1. Create conversation
          RESPONSE=$(curl -s -X POST "http://localhost:8000/api/conversations" \
            -H "Content-Type: application/json" \
            -H "X-Session-API-Key: $API_KEY" \
            -d "$PAYLOAD")

          CONV_ID=$(echo "$RESPONSE" | jq -r '.conversation_id')
          echo "💬 Created Conversation ID: $CONV_ID"

          if [ "$CONV_ID" = "null" ] || [ -z "$CONV_ID" ]; then
            echo "❌ Failed to create OpenHands conversation."
            exit 1
          fi

          echo "✅ Task successfully dispatched to OpenHands session: $CONV_ID"
