name: OpenHands Issue Resolver

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: true
        default: '3'

jobs:
  resolve-issue:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/resolve') || contains(github.event.comment.body, '@openhands') }}
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Fetch Issue Details & Prepare Branch Name
        id: prep
        run: |
          ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number || '3' }}"
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          
          # 获取 Issue 标题并格式化为分支名
          ISSUE_TITLE=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM" | jq -r '.title')
          
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/-\+/-/g' -e 's/^-//' -e 's/-$//' | cut -c 1-30)
          BRANCH_NAME="issue-${ISSUE_NUM}-${CLEAN_TITLE}"
          
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT

      - name: Setup Git Identity & Switch Branch
        run: |
          git config --global user.name "liaozt160"
          git config --global user.email "liaozt160@users.noreply.github.com"
          
          BRANCH_NAME="${{ steps.prep.outputs.branch_name }}"
          git checkout -b "$BRANCH_NAME"

      - name: Run OpenHands Resolver
        id: openhands-run
        run: |
          set -x
          export HTTP_PROXY="http://192.168.0.101:10808"
          export HTTPS_PROXY="http://192.168.0.101:10808"
          export http_proxy="http://192.168.0.101:10808"
          export https_proxy="http://192.168.0.101:10808"
          export NO_PROXY="localhost,127.0.0.1,192.168.0.101,192.168.0.30,192.168.0.0/16"
          export no_proxy="localhost,127.0.0.1,192.168.0.101,192.168.0.30,192.168.0.0/16"
          export LITELLM_DROP_PARAMS="true"
          
          export LLM_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export LITELLM_PROXY_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export OPENAI_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export LLM_MODEL="litellm_proxy/gemini-flash-main"
          export LLM_BASE_URL="http://192.168.0.101:4000/v1"
          
          cd "${{ github.workspace }}"
          ISSUE_NUM="${{ steps.prep.outputs.issue_num }}"
          
          /home/liao/.openhands-venv/bin/python -m openhands.resolver.resolve_issue \
            --issue-number "$ISSUE_NUM" \
            --selected-repo ${{ github.repository }} \
            --token ${{ github.token }} \
            --username liaozt160 \
            --max-iterations 5
        env:
          LLM_MODEL: litellm_proxy/gemini-flash-main
          LLM_BASE_URL: "http://192.168.0.101:4000/v1"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          LITELLM_PROXY_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit, Push and Create Pull Request
        run: |
          BRANCH_NAME="${{ steps.prep.outputs.branch_name }}"
          ISSUE_NUM="${{ steps.prep.outputs.issue_num }}"
          ISSUE_TITLE="${{ steps.prep.outputs.issue_title }}"
          
          # 清理 OpenHands 产生的运行时临时文件/嵌套 git 目录
          rm -rf output/
          
          # 检查是否有实际代码修改
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing..."
            git add .
            git commit -m "fix: resolve issue #${ISSUE_NUM} via OpenHands"
            git push origin "$BRANCH_NAME" --force
            
            # 使用 cURL 调用 API 创建 PR，替代缺失的 gh 工具
            echo "Creating Pull Request via GitHub API..."
            curl -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pulls \
              -d @- <<EOF
            {
              "title": "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}",
              "head": "${BRANCH_NAME}",
              "base": "main",
              "body": "This PR was automatically generated by OpenHands to resolve #${ISSUE_NUM}."
            }
          EOF
          else
            echo "No code changes detected after cleanup."
          fi
