name: OpenHand Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Prepare Local Repository
        run: |
          set -e
          # 直接使用 GitHub Actions 内置的 workspace 变量，避免路径硬编码错误
          # github.workspace = /home/liao/actions-runner/_work/fawords/fawords (Runner 自动创建)
          SOURCE_DIR="/home/liao/workspace/fawords_setup/fawords"
          WORK_DIR="${{ github.workspace }}"
          
          echo "Source: $SOURCE_DIR"
          echo "Work dir: $WORK_DIR"
          
          # 清空工作目录并复制内容（使用数组避免 glob 展开问题）
          shopt -s dotglob nullglob
          files=("$SOURCE_DIR"/*)
          if [ ${#files[@]} -gt 0 ]; then
            rm -rf "$WORK_DIR"/*
            cp -r "${files[@]}" "$WORK_DIR"/
            # 复制 .git 目录
            [ -d "$SOURCE_DIR/.git" ] && cp -r "$SOURCE_DIR/.git" "$WORK_DIR"/
          fi
          
          cd "$WORK_DIR"
          git fetch --all --tags --prune
          git reset --hard origin/main
          echo "Workspace ready at $(pwd)"

      - name: Install OpenHands Dependencies
        run: |
          pip3 install openhands-ai --break-system-packages

      - name: Run OpenHands Resolver
        id: openhands-run
        run: |
          set -x
          export HTTP_PROXY="http://192.168.0.101:10808"
          export HTTPS_PROXY="http://192.168.0.101:10808"
          export LITELLM_DROP_PARAMS="true"
          
          cd "${{ github.workspace }}"
          
          python3 -m openhands.core.main \
            --issue ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --debug
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL || 'litellm_proxy/gemini-3.5-flash-group' }}
          LLM_API_BASE: "http://192.168.0.101:4000/"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}