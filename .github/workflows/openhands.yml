name: OpenHand Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Prepare Local Repository
        run: |
          set -e
          # 使用宿主机已有的仓库副本，完全避免外部网络 checkout 失败
          cp -r /home/liao/workspace/fawords_setup/fawords /home/liao/actions-runner/_work/fawords/fawords
          cd /home/liao/actions-runner/_work/fawords/fawords
          git fetch --all --tags --prune
          git reset --hard origin/main
          echo "Workspace ready at $(pwd)"

      - name: Install OpenHands Dependencies
        run: |
          pip3 install openhands-ai --break-system-packages

      - name: Run OpenHands Resolver
        id: openhands-run
        run: |
          set -x
          export HTTP_PROXY="http://192.168.0.101:10808"
          export HTTPS_PROXY="http://192.168.0.101:10808"
          export LITELLM_DROP_PARAMS="true"
          
          cd /home/liao/actions-runner/_work/fawords/fawords
          
          python3 -m openhands.core.main \
            --issue ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --debug
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL || 'litellm_proxy/gemini-3.5-flash-group' }}
          LLM_API_BASE: "http://192.168.0.101:4000/"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}