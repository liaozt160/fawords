name: OpenHands Issue Resolver

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: true
        default: '3'

jobs:
  resolve-issue:
    # 仅响应 /resolve、@openhands 或手动 trigger，避免普通评论误触发
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/resolve') || contains(github.event.comment.body, '@openhands') }}
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Print Current Directory
        run: |
          echo "=========================================="
          echo "当前工作目录 (pwd): $(pwd)"
          echo "GitHub Workspace 变量: ${{ github.workspace }}"
          echo "=========================================="

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Fetch Issue Details
        id: prep
        run: |
          ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number || '3' }}"
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Pre-clean Environment Zombie Processes
        run: |
          # 运行前清理可能残留的前台/后台阻塞进程
          pkill -f "spring-boot:run" || true
          pkill -f "mvn" || true
          pkill -f "python" || true
          pkill -f "node" || true

      - name: Run OpenHands Resolver
        id: openhands-run
        run: |
          set -x
          # 1. 代理配置
          export HTTP_PROXY="http://192.168.0.101:10808"
          export HTTPS_PROXY="http://192.168.0.101:10808"
          export http_proxy="http://192.168.0.101:10808"
          export https_proxy="http://192.168.0.101:10808"
          export NO_PROXY="localhost,127.0.0.1,192.168.0.101,192.168.0.30,192.168.0.0/16"
          export no_proxy="localhost,127.0.0.1,192.168.0.101,192.168.0.30,192.168.0.0/16"
          
          # 2. 持久化依赖缓存 (针对各种语言环境)
          export MAVEN_OPTS="-Dmaven.repo.local=/home/liao/.m2/repository"
          export GRADLE_USER_HOME="/home/liao/.gradle"
          export PIP_CACHE_DIR="/home/liao/.cache/pip"
          export UV_CACHE_DIR="/home/liao/.cache/uv"
          export npm_config_cache="/home/liao/.npm"

          # 3. LLM 及 OpenHands 变量
          export LITELLM_DROP_PARAMS="true"
          export LLM_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export LITELLM_PROXY_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export OPENAI_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}"
          export LLM_MODEL="litellm_proxy/gemini-flash-lite"
          export LLM_BASE_URL="http://192.168.0.101:4000/v1"

          # 4. 插入针对 Agent 的全局行为指令（防止启动阻塞服务）
          export SYSTEM_PROMPT_APPENDIX="IMPORTANT: Do NOT run persistent foreground commands like 'mvn spring-boot:run', './gradlew bootRun', 'npm start', or 'python main.py'. Always run unit tests with 'mvn test', 'gradle test', 'npm test', or 'pytest' instead."
          cd "${{ github.workspace }}"
          ISSUE_NUM="${{ steps.prep.outputs.issue_num }}"
          
          /home/liao/.openhands-venv/bin/python -m openhands.resolver.resolve_issue \
            --issue-number "$ISSUE_NUM" \
            --selected-repo ${{ github.repository }} \
            --token ${{ github.token }} \
            --username liaozt160 \
            --max-iterations 40
        env:
          LLM_MODEL: litellm_proxy/gemini-flash-lite
          LLM_BASE_URL: "http://192.168.0.101:4000/v1"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          LITELLM_PROXY_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push Branch and Create PR Directly from OpenHands Workspace
        run: |
          set -e
          ISSUE_NUM="${{ steps.prep.outputs.issue_num }}"
          
          # 1. Use $(pwd) for actual runner workspace detection
          TARGET_DIR="$(pwd)/output/workspace/issue_${ISSUE_NUM}"
          
          if [ ! -d "$TARGET_DIR" ]; then
            echo "OpenHands output workspace not found at $TARGET_DIR"
            echo "Checking for changes in current directory..."
            cd "$(pwd)"
            if [ -n "$(git status --porcelain)" ]; then
              echo "Found changes in main workspace, proceeding..."
            else
              echo "No changes found. Exiting."
              exit 1
            fi
          else
            cd "$TARGET_DIR"
          fi

          # 2. Check for changes and create PR
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes found. Processing PR..."
            
            git config user.name "liaozt160"
            git config user.email "liaozt160@users.noreply.github.com"

            ISSUE_TITLE=$(curl -s -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM" | jq -r '.title')
            CLEAN_TITLE=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/-\+/-/g' -e 's/^-//' -e 's/-$//' | cut -c 1-30)
            BRANCH_NAME="issue-${ISSUE_NUM}-${CLEAN_TITLE}"

            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "fix: resolve issue #${ISSUE_NUM} via OpenHands"
            
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH_NAME" --force

            curl -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pulls \
              -d @- <<EOF
            {
              "title": "fix: resolve #${ISSUE_NUM} - ${ISSUE_TITLE}",
              "head": "${BRANCH_NAME}",
              "base": "main",
              "body": "This PR was automatically generated by OpenHands to resolve #${ISSUE_NUM}."
            }
          EOF
          else
            echo "No code changes found after execution."
            exit 1
          fi
