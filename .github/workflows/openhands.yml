name: OpenHand Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    if: contains(github.event.comment.body, '@openhand')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run OpenHands Resolver
        uses: All-Hands-AI/OpenHands/.github/workflows/openhands-resolver.yml@main
        with:
          LLM_MODEL: "litellm_proxy/gpt-4o"
          LLM_API_BASE: "http://192.168.0.101:4000/"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
