name: OpenHand Issue Resolver

on:
  issue_comment:
    types: [created]

jobs:
  resolve-issue:
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Checkout Fawords Repository
        uses: actions/checkout@v4
        with:
          repository: liaozt160/fawords
          token: ${{ secrets.PAT_TOKEN }}

      - name: Run OpenHands Resolver
        id: openhands-run
        # 移除了顶层 if，改在这里进行逻辑判断和执行
        if: contains(github.event.comment.body, '@openhand')
        run: |
          set -x
          echo "Executing OpenHands Resolver for issue: ${{ github.event.issue.number }}"
          docker run --rm \
            -e LLM_MODEL="${{ vars.LLM_MODEL || 'litellm_proxy/gemini-3.5-flash-group' }}" \
            -e LLM_API_BASE="${{ vars.LLM_API_BASE || 'http://192.168.0.101:4000/' }}" \
            -e LLM_API_KEY="${{ secrets.OPENHANDS_LLM_API_KEY }}" \
            -e GITHUB_TOKEN="${{ secrets.PAT_TOKEN }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_ISSUE_NUMBER="${{ github.event.issue.number }}" \
            -e HTTP_PROXY="http://192.168.0.101:10808" \
            -e HTTPS_PROXY="http://192.168.0.101:10808" \
            -e LITELLM_DROP_PARAMS="true" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/openhands/openhands:main \
            python3 -m openhands.core.main --issue ${{ github.event.issue.number }} --repo ${{ github.repository }} --debug
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          OPENHANDS_LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          LITELLM_DROP_PARAMS: "true"
