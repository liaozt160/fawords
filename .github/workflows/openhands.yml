name: OpenHand Issue Resolver

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: true
        default: '3'

jobs:
  resolve-issue:
    runs-on: [self-hosted, st]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Run OpenHands Resolver
        id: openhands-run
        run: |
          set -x
          export HTTP_PROXY="http://192.168.0.101:10808"
          export HTTPS_PROXY="http://192.168.0.101:10808"
          export LITELLM_DROP_PARAMS="true"
          
          cd "${{ github.workspace }}"
          
          ISSUE_NUM="${{ github.event.issue.number || github.event.inputs.issue_number || '3' }}"
          
          /home/liao/.openhands-venv/bin/python -m openhands.resolver.resolve_issue \
            --issue-number "$ISSUE_NUM" \
            --selected-repo ${{ github.repository }} \
            --token ${{ github.token }} \
            --username liaozt160 \
            --llm-model ${{ vars.LLM_MODEL || 'litellm_proxy/gemini-3.5-flash-group' }} \
            --llm-base-url "http://192.168.0.101:4000/" \
            --llm-api-key ${{ secrets.OPENHANDS_LLM_API_KEY }} \
            --max-iterations 3
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL || 'litellm_proxy/gemini-3.5-flash-group' }}
          LLM_API_BASE: "http://192.168.0.101:4000/"
          LLM_API_KEY: ${{ secrets.OPENHANDS_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
