name: 📦 Auto Version Tagging

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'pom.xml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version-tag:
    name: 🏷️ Create Version Tag & Update POM
    runs-on: [self-hosted, st]
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Get latest tag
        id: latest_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match="v[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: 📊 Determine version
        id: version
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          CURRENT_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🔧 Update pom.xml version
        run: |
          ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: 💾 Commit, Tag and Push
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "chore(release): v$NEW_VERSION [skip ci]" || echo "No changes to commit"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
