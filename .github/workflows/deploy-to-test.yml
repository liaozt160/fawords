name: 🚀 Deploy to Test Service

on:
  workflow_run:
    workflows: ["📦 Auto Version Tagging"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: 🐳 Deploy Test Container
    runs-on: [self-hosted, st]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Test Service via Local Docker Build
        run: |
          # 1. 确保目标部署目录存在
          sudo mkdir -p /home/liao/deployments/fawords-test
          
          # 2. 生成 docker-compose.yml 配置文件（注意 context 使用当前 runner 目录下的代码，避免权限越权）
          sudo cat << 'EOF' | sudo tee /home/liao/deployments/fawords-test/docker-compose.yml
          services:
            app:
              image: fawords:latest
              build: 
                context: .
                dockerfile: Dockerfile
              ports:
                - "8081:8080"
              environment:
                - SPRING_PROFILES_ACTIVE=test
                - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
                - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
                - SPRING_DATASOURCE_USERNAME=sa
                - SPRING_DATASOURCE_PASSWORD=
                - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
                - SPRING_H2_CONSOLE_ENABLED=true
              restart: always
          EOF

          # 3. 把当前工作区的代码复制到部署目录中，确保 build context 安全在目录下
          sudo cp -r . /home/liao/deployments/fawords-test/
          
          # 4. 在部署目录下执行重新构建与启动
          cd /home/liao/deployments/fawords-test
          docker-compose up -d --build
          echo "✅ Test service re-deployed successfully at http://192.168.0.30:8081"
