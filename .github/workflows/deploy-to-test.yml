name: 🚀 Deploy to Test Service

on:
  workflow_run:
    workflows: ["📦 Auto Version Tagging"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: 🐳 Deploy Test Container
    runs-on: [self-hosted, st]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Ensure Deployments Directory and Permissions
        run: |
          sudo mkdir -p /home/liao/deployments/fawords-test
          # Only use chmod to grant permissions, avoid chown as user 'liao' might not exist in runner container
          sudo chmod -R 777 /home/liao/deployments/fawords-test

      - name: 🚀 Rebuild & Deploy Test Service
        run: |
          cd /home/liao/deployments/fawords-test
          docker-compose up -d --build
          echo "✅ Test service re-deployed successfully at http://192.168.0.30:8081"
