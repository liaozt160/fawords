name: Test Runner - Automated Build & Diagnostics

on:
  push:
    branches: [ test-runner ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.x'
  PROJECT_NAME: 'fawords'
  PROJECT_DESCRIPTION: 'Spring Boot 3.3.2 Authentication & Security Service'

jobs:
  test-job:
    name: Diagnose & Test Environment
    runs-on: [self-hosted, st]
    
    steps:
      # ============================================
      # STEP 1: Setup & Repository Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # ============================================
      # STEP 2: System Environment Diagnostics
      # ============================================
      - name: Diagnose System Environment
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║             SYSTEM ENVIRONMENT DIAGNOSTICS - START                ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📍 RUNNER INFORMATION:"
          echo "   Host Name: $(hostname)"
          echo "   Runner Type: Self-Hosted"
          echo "   Active User: $(whoami)"
          echo "   Current Directory: $(pwd)"
          echo ""
          echo "🖥️  OS DETAILS:"
          uname -a
          echo ""
          echo "💾 SYSTEM RESOURCES:"
          echo "   Total Memory:" 
          free -h 2>/dev/null || vm_stat | grep -i "Pages free" || echo "   N/A - Windows system"
          echo "   CPU Count: $(nproc 2>/dev/null || echo 'N/A')"
          echo ""

      # ============================================
      # STEP 3: Required Tools Verification
      # ============================================
      - name: Verify Required Development Tools
        run: |
          echo "🔧 REQUIRED DEVELOPMENT TOOLS:"
          echo ""
          
          echo "   ✓ Git:"
          command -v git &> /dev/null && git --version || (echo "      ❌ NOT FOUND" && exit 1)
          
          echo "   ✓ Java (Required: ${{ env.JAVA_VERSION }}):"
          command -v java &> /dev/null && java -version 2>&1 | head -n 3 || (echo "      ❌ NOT FOUND" && exit 1)
          
          echo "   ✓ Maven:"
          command -v mvn &> /dev/null && mvn -version | head -n 1 || (echo "      ❌ NOT FOUND" && exit 1)
          
          echo "   ✓ Docker:"
          command -v docker &> /dev/null && docker --version || echo "      ⚠️  OPTIONAL - Not found"
          
          echo "   ✓ cURL:"
          command -v curl &> /dev/null && curl --version | head -n 1 || echo "      ⚠️  OPTIONAL - Not found"
          echo ""

      # ============================================
      # STEP 4: Java & Maven Environment Details
      # ============================================
      - name: Display Java & Maven Configuration
        run: |
          echo "☕ JAVA ENVIRONMENT:"
          echo "   JAVA_HOME: ${JAVA_HOME:-'Not set'}"
          java -XshowSettings:properties -version 2>&1 | grep -E "java.version|java.home" || true
          echo ""
          echo "📦 MAVEN ENVIRONMENT:"
          mvn -version
          echo ""
          
      # ============================================
      # STEP 5: Project Dependencies Analysis
      # ============================================
      - name: Analyze Project Dependencies
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║            PROJECT DEPENDENCIES & CONFIGURATION                   ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📋 PROJECT METADATA:"
          echo "   Name: ${{ env.PROJECT_NAME }}"
          echo "   Description: ${{ env.PROJECT_DESCRIPTION }}"
          echo "   Base Framework: Spring Boot 3.3.2"
          echo "   Java Version: ${{ env.JAVA_VERSION }}"
          echo ""
          echo "📚 DEPENDENCY TREE (Top Level):"
          mvn dependency:tree -DoutputFile=/tmp/deps.txt 2>&1 | tail -20 || true
          echo ""
          echo "🔍 KEY DEPENDENCIES MANIFEST:"
          mvn help:describe -Dartifact=com.fawords:fawords:0.0.1-SNAPSHOT 2>&1 | head -20 || true
          echo ""
          
      # ============================================
      # STEP 6: Detailed Dependency Information
      # ============================================
      - name: Check Core Dependencies Details
        run: |
          echo "🔐 CORE FRAMEWORK DEPENDENCIES:"
          echo ""
          echo "   Spring Boot Stack:"
          echo "      - spring-boot-starter-web (REST/Web API)"
          echo "      - spring-boot-starter-data-jpa (Database ORM)"
          echo "      - spring-boot-starter-security (Authentication/Authorization)"
          echo "      - spring-boot-starter-validation (Input Validation)"
          echo "      - spring-boot-starter-test (Testing Framework)"
          echo ""
          echo "   Security & JWT:"
          echo "      - io.jsonwebtoken:jjwt-api:0.11.5 (JWT Token Creation)"
          echo "      - io.jsonwebtoken:jjwt-impl:0.11.5 (JWT Implementation)"
          echo "      - io.jsonwebtoken:jjwt-jackson:0.11.5 (JSON Serialization)"
          echo ""
          echo "   Database & ORM:"
          echo "      - spring-boot-starter-data-jpa (Hibernate/JPA)"
          echo "      - com.h2database:h2 (In-Memory DB for Testing)"
          echo ""
          echo "   Utilities & Documentation:"
          echo "      - org.projectlombok:lombok (Code Generation)"
          echo "      - org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0 (Swagger/OpenAPI)"
          echo ""
          
      # ============================================
      # STEP 7: Maven Clean & Build
      # ============================================
      - name: Build Project with Maven
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║                   BUILDING PROJECT WITH MAVEN                      ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          mvn clean package -V -DskipTests=false -X 2>&1 | tee build.log
          BUILD_STATUS=$?
          echo ""
          echo "✅ Build Status: $BUILD_STATUS"
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✓ Build completed successfully"
          else
            echo "✗ Build failed"
            exit $BUILD_STATUS
          fi
          
      # ============================================
      # STEP 8: Run Unit Tests
      # ============================================
      - name: Run Unit Tests with Coverage
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║                     EXECUTING UNIT TESTS                           ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          mvn test -V 2>&1 | tee test.log
          TEST_STATUS=$?
          echo ""
          if [ $TEST_STATUS -eq 0 ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed"
            exit $TEST_STATUS
          fi
          
      # ============================================
      # STEP 9: Generate Test Report
      # ============================================
      - name: Generate & Display Test Results
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║                    TEST RESULTS SUMMARY                            ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          if [ -f "target/surefire-reports/TEST-*.xml" ]; then
            echo "📊 Test Report Files Generated:"
            ls -la target/surefire-reports/ | grep "\.xml\|\.txt" || echo "No reports found"
          fi
          echo ""
          
      # ============================================
      # STEP 10: Build Artifact Information
      # ============================================
      - name: Display Build Artifacts
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║                   BUILD ARTIFACTS GENERATED                        ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          if [ -d "target" ]; then
            echo "📦 Generated Artifacts:"
            ls -lh target/*.jar target/*.war 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}' || echo "   No JAR/WAR files generated"
            echo ""
            echo "📁 Target Directory Size:"
            du -sh target/
          fi
          echo ""
          
      # ============================================
      # STEP 11: Security Scan & Report
      # ============================================
      - name: Security & Dependency Audit
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║             DEPENDENCY SECURITY AUDIT                             ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔐 Checking for Known Vulnerabilities:"
          mvn dependency:check-updates 2>&1 | grep -E "Update|SNAPSHOT|Updates available" || echo "   No updates needed"
          echo ""
          
      # ============================================
      # STEP 12: Final Summary
      # ============================================
      - name: Display Final Summary
        if: always()
        run: |
          echo "╔════════════════════════════════════════════════════════════════════╗"
          echo "║            BUILD & DIAGNOSTICS WORKFLOW COMPLETED                 ║"
          echo "╚════════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🎯 SUMMARY:"
          echo "   Project: ${{ env.PROJECT_NAME }}"
          echo "   Java Version: ${{ env.JAVA_VERSION }}"
          echo "   Framework: Spring Boot 3.3.2"
          echo "   Status: Diagnostic workflow executed"
          echo ""
          echo "📝 NEXT STEPS:"
          echo "   1. Review build output in build.log"
          echo "   2. Check test results in target/surefire-reports/"
          echo "   3. Verify all artifacts in target/ directory"
          echo "   4. Check for any security warnings above"
          echo ""
